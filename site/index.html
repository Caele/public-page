<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schakt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #2a2a2a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: sans-serif;
      }
      h1 {
        color: #f0c040;
        font-size: 2rem;
        letter-spacing: 0.15em;
        margin-bottom: 16px;
        text-transform: uppercase;
      }
      canvas {
        display: block;
        border: 4px solid #5a3a1a;
        border-radius: 4px;
        /* Scale down on small screens, but never exceed the logical size */
        width: min(640px, calc(100vw - 16px));
        aspect-ratio: 640 / 700;
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body>
    <h1>⚙️ Schakt</h1>
    <canvas id="game"></canvas>
  </body>
</html>
